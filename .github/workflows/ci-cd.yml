name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Data Pipeline Tests
  ingestion-tests:
    name: Ingestion Service Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/services/data-pipeline/ingestion/requirements.txt

      - name: Create virtual environment and install dependencies
        run: |
          cd backend/services/data-pipeline/ingestion
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Run ingestion tests
        run: |
          cd backend/services/data-pipeline/ingestion
          source venv/bin/activate
          export PYTHONPATH="${PWD}/src:$PYTHONPATH"
          pytest test/ -v --tb=short
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  normalization-tests:
    name: Normalization Service Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports:
          - 2181:2181

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/services/data-pipeline/noramlization/requirements.txt

      - name: Create virtual environment and install dependencies
        run: |
          cd backend/services/data-pipeline/noramlization
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Run normalization tests
        run: |
          cd backend/services/data-pipeline/noramlization
          source venv/bin/activate
          export PYTHONPATH="${PWD}/src:$PYTHONPATH"
          pytest test/unit_test/ -v --tb=short
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_db
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  preprocessing-tests:
    name: Pre-processing Service Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/services/data-pipeline/pre-processing/requirements.txt

      - name: Create virtual environment and install dependencies
        run: |
          cd backend/services/data-pipeline/pre-processing
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Run preprocessing tests
        run: |
          cd backend/services/data-pipeline/pre-processing
          source venv/bin/activate
          export PYTHONPATH="${PWD}/src:$PYTHONPATH"
          pytest test/unit-test/ -v --tb=short
        env:
          MONGODB_URL: mongodb://localhost:27017
          MONGO_DB_NAME: job_preprocessing

  # Frontend Build
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint
        continue-on-error: true

      - name: Build
        run: |
          cd frontend
          npm run build

  # Backend Docker Build (optional)
  backend-docker-build:
    name: Backend Docker Images Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ingestion image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/data-pipeline/ingestion
          file: ./backend/services/data-pipeline/ingestion/Dockerfile
          push: false
          tags: ajitkhdem/ingestion:latest

      - name: Build normalization image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/data-pipeline/noramlization
          file: ./backend/services/data-pipeline/noramlization/dockerfile
          push: false
          tags: ajitkhdem/normalization:latest

      - name: Build preprocessing image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/data-pipeline/pre-processing
          file: ./backend/services/data-pipeline/pre-processing/DockerFile
          push: false
          tags: ajitkhdem/preprocessing:latest

  # Summary
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [ingestion-tests, normalization-tests, preprocessing-tests, frontend-build]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.ingestion-tests.result }}" = "failure" ] || \
             [ "${{ needs.normalization-tests.result }}" = "failure" ] || \
             [ "${{ needs.preprocessing-tests.result }}" = "failure" ] || \
             [ "${{ needs.frontend-build.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi
